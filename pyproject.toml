[project]
name = "adaptive-chess-ai"
version = "0.1.0"
description = "Platforma do analizy skuteczności adaptacyjnych botów szachowych."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE", "RUF"]

[tool.mypy]
python_version = "3.10"
files = ["src", "scripts", "tests"]
ignore_missing_imports = true
no_site_packages = true
warn_unused_ignores = true

# Keep bilingual catalogue entries together for review.
[tool.ruff.lint.per-file-ignores]
"src/adaptive_chess/ui/i18n.py" = ["E501"]
